<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="titol-svg desc-svg">
  <title id="titol-svg">De la idea al programa</title>
  <desc id="desc-svg">Esquema: una idea es dividix en passos, es convertix en codi Java, es prova i funciona.</desc>

  <defs>
    <linearGradient id="fons" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F4A"/>
      <stop offset="100%" stop-color="#050F26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="llum" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="llum2" cx="100%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="graella" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7BA4F7" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#03081C" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="720" height="560" rx="28" fill="url(#fons)"/>
  <rect width="720" height="560" rx="28" fill="url(#graella)"/>
  <rect width="720" height="560" rx="28" fill="url(#llum)"/>
  <rect width="720" height="560" rx="28" fill="url(#llum2)"/>
  <rect x="0.75" y="0.75" width="718.5" height="558.5" rx="28" fill="none" stroke="#7BA4F7" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Etiqueta superior -->
  <g>
    <rect x="40" y="36" width="252" height="30" rx="15" fill="#06B6D4" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="58" cy="51" r="4.5" fill="#22D3EE"/>
    <text x="72" y="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#A5F3FC">OPTATIVA SMX · JAVA</text>
  </g>

  <!-- Finestra de codi -->
  <g filter="url(#ombra)">
    <rect x="40" y="96" width="640" height="228" rx="16" fill="#071A3D" stroke="#7BA4F7" stroke-opacity="0.30"/>
    <rect x="40" y="96" width="640" height="38" rx="16" fill="#0C2A5C"/>
    <rect x="40" y="120" width="640" height="14" fill="#0C2A5C"/>
    <circle cx="64" cy="115" r="6" fill="#EF6B5E"/>
    <circle cx="84" cy="115" r="6" fill="#F5BF4F"/>
    <circle cx="104" cy="115" r="6" fill="#62C554"/>
    <text x="128" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#8FA8CE">HolaMon.java</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="500">
      <text x="66" y="170" fill="#FF9ECD">public class</text>
      <text x="182" y="170" fill="#7AD7FF">HolaMon</text>
      <text x="250" y="170" fill="#CFE0F7">{</text>

      <text x="86" y="200" fill="#FF9ECD">public static void</text>
      <text x="242" y="200" fill="#9FF7D2">main</text>
      <text x="278" y="200" fill="#CFE0F7">(</text>
      <text x="286" y="200" fill="#7AD7FF">String</text>
      <text x="336" y="200" fill="#CFE0F7">[] args) {</text>

      <text x="106" y="230" fill="#7AD7FF">System</text>
      <text x="162" y="230" fill="#CFE0F7">.out.println(</text>
      <text x="266" y="230" fill="#FFD479">"Hola món!"</text>
      <text x="356" y="230" fill="#CFE0F7">);</text>

      <text x="86" y="260" fill="#CFE0F7">}</text>
      <text x="66" y="290" fill="#CFE0F7">}</text>
      <text x="440" y="290" fill="#7F93B5" font-style="italic">// ja està: això és un programa</text>
    </g>
  </g>

  <!-- Passos -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g>
      <rect x="40" y="368" width="140" height="80" rx="14" fill="#EEF4FF" fill-opacity="0.10" stroke="#7BA4F7" stroke-opacity="0.55"/>
      <text x="110" y="404" text-anchor="middle" font-size="26">💡</text>
      <text x="110" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#DBE7FE">Entendre</text>
    </g>
    <path d="M190 408h22" stroke="#F97316" stroke-width="3" marker-end="url(#fletxa)"/>
    <g>
      <rect x="222" y="368" width="140" height="80" rx="14" fill="#EEF4FF" fill-opacity="0.10" stroke="#7BA4F7" stroke-opacity="0.55"/>
      <text x="292" y="404" text-anchor="middle" font-size="26">🧩</text>
      <text x="292" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#DBE7FE">Dividir</text>
    </g>
    <path d="M372 408h22" stroke="#F97316" stroke-width="3" marker-end="url(#fletxa)"/>
    <g>
      <rect x="404" y="368" width="140" height="80" rx="14" fill="#EEF4FF" fill-opacity="0.10" stroke="#7BA4F7" stroke-opacity="0.55"/>
      <text x="474" y="404" text-anchor="middle" font-size="26">⌨️</text>
      <text x="474" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#DBE7FE">Programar</text>
    </g>
    <path d="M554 408h22" stroke="#F97316" stroke-width="3" marker-end="url(#fletxa)"/>
    <g>
      <rect x="586" y="368" width="94" height="80" rx="14" fill="#06B6D4" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.6"/>
      <text x="633" y="404" text-anchor="middle" font-size="26">✅</text>
      <text x="633" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#A5F3FC">Provar</text>
    </g>
  </g>

  <rect x="40" y="486" width="640" height="6" rx="3" fill="url(#accent)"/>
  <text x="40" y="524" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#8FA8CE">Programar és explicar a l'ordinador, pas a pas, com resoldre un problema.</text>

  <defs>
    <marker id="fletxa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#F97316"/>
    </marker>
  </defs>
</svg>
